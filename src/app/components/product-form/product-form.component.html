<div class="form-card">
  <h3>{{ isEditMode ? 'Editar producto' : 'Nuevo producto' }}</h3>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="field">
      <label for="barcode">Código de barras</label>
      <input id="barcode" type="text" formControlName="barcode" placeholder="Ej: 7501055302427" />
    </div>

    <div class="field">
      <label for="name">Nombre <span class="required">*</span></label>
      <input id="name" type="text" formControlName="name" placeholder="Nombre del producto" />
      <span class="error" *ngIf="hasError('name')">El nombre es obligatorio.</span>
    </div>

    <div class="field">
      <label for="quantity">Cantidad <span class="required">*</span></label>
      <input id="quantity" type="number" formControlName="quantity" min="0" />
      <span class="error" *ngIf="hasError('quantity')">La cantidad debe ser un número ≥ 0.</span>
    </div>

    <div class="field">
      <label for="price">Precio <span class="required">*</span></label>
      <input id="price" type="number" formControlName="price" min="0" step="0.01" />
      <span class="error" *ngIf="hasError('price')">El precio debe ser un número ≥ 0.</span>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn-save">Guardar</button>
      <button type="button" class="btn-cancel" (click)="onCancel()">Cancelar</button>
    </div>
  </form>
</div>
